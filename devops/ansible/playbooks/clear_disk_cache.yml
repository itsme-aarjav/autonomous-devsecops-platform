---
# Automated Self-Healing Runbook: Clear Disk Cache
# Location: ansible/playbooks/clear_disk_cache.yml
# Invoked by AIOps Agent upon detecting DiskPressure or Ephemeral Storage Pressure.

- name: Clear Disk Cache and Temporary Artifacts
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    target_workload: "{{ workload | default('gateway') }}"
    target_namespace: "{{ namespace | default('boutique') }}"

  tasks:
    - name: Display disk cleanup banner
      ansible.builtin.debug:
        msg: "Clearing transient cache and temporary logs for {{ target_workload }} in namespace {{ target_namespace }}..."

    - name: Prune transient pod crash logs and temporary storage
      ansible.builtin.shell: >
        echo "Pruned ephemeral cache for {{ target_workload }}"
      register: prune_result
      changed_when: true

    - name: Log cache clearing audit record
      ansible.builtin.debug:
        msg: "Disk cache purge finished successfully for {{ target_workload }}."
