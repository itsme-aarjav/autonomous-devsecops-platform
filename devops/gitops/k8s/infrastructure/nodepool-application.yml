apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata:
  name: application-nodeclass
spec:
  role: boutique-dev-eks-node-role
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: boutique-dev-eks
        topology.kubernetes.io/zone: us-east-2a
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: boutique-dev-eks
  ephemeralStorage:
    size: 30Gi
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: application-spot
spec:
  template:
    metadata:
      labels:
        workload-class: application
        node-lifecycle: spot
        role: stateless-apps
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: application-nodeclass
      taints:
        - key: spot-instance
          value: "true"
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: eks.amazonaws.com/instance-family
          operator: In
          values: ["m7i-flex", "m6i", "c7i", "c6i"]
        - key: eks.amazonaws.com/instance-size
          operator: In
          values: ["large"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["us-east-2a"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
  limits:
    cpu: "8"
    memory: 16Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
