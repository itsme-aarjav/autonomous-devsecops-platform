apiVersion: apps/v1
kind: Deployment
metadata:
  name: boutique-canary
  namespace: boutique
  labels:
    app: canary
    app.kubernetes.io/name: canary
    app.kubernetes.io/part-of: autonomous-devsecops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary
  template:
    metadata:
      labels:
        app: canary
    spec:
      tolerations:
        - key: "role"
          operator: "Equal"
          value: "core-platform"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: In
                    values:
                      - core-platform
      containers:
        - name: canary
          image: public.ecr.aws/docker/library/alpine:3.19
          command:
            - /bin/sh
            - -ec
            - |
              echo "[$(date -u +%FT%TZ)] Starting Boutique Canary Worker..."
              trigger_check() {
                if [ -f /etc/canary-trigger/inject-oom ] && [ "$(cat /etc/canary-trigger/inject-oom 2>/dev/null)" = "true" ]; then
                  MEM_LIMIT=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || echo "134217728")
                  if [ "$MEM_LIMIT" != "max" ] && [ "$MEM_LIMIT" -le 134217728 ]; then
                    echo "[$(date -u +%FT%TZ)] Canary trigger active and memory limit is ${MEM_LIMIT} bytes (<= 128Mi). Simulating bounded memory load (~160MB)..."
                    awk 'BEGIN{for(i=0;i<4000000;i++) a[i]="oom_test";}'
                  else
                    echo "[$(date -u +%FT%TZ)] Canary memory limit is ${MEM_LIMIT} bytes (> 128Mi). Bounded workload resolved by remediation; running stably."
                  fi
                fi
              }
              trigger_check
              trap "exit 0" TERM INT
              while true; do
                trigger_check
                sleep 5
              done
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: canary-trigger-volume
              mountPath: /etc/canary-trigger
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: canary-trigger-volume
          configMap:
            name: boutique-canary-trigger
            optional: true
