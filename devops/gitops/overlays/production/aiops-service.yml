---
# Internal ClusterIP Service for AIOps Health Probes
# Location: gitops/overlays/production/aiops-service.yml
#
# SECURITY DIRECTIVES:
# - Strictly internal ClusterIP (no LoadBalancer, NodePort, or Ingress).
# - Only exposes port 8080 for liveness, readiness, and alert webhook ingestion.

apiVersion: v1
kind: Service
metadata:
  name: aiops-assistant
  namespace: boutique
  labels:
    app.kubernetes.io/name: aiops-assistant
    app.kubernetes.io/part-of: autonomous-devsecops-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aiops-assistant
  ports:
    - name: http-health
      port: 8080
      targetPort: 8080
      protocol: TCP
