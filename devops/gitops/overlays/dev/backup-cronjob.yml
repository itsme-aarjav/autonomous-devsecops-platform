apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-daily
  namespace: boutique
  labels:
    app: postgres-backup
    component: database
    schedule: daily-0200-ist
spec:
  # Daily at 02:00 AM Asia/Kolkata (native Kubernetes timezone support)
  schedule: "0 2 * * *"
  timeZone: "Asia/Kolkata"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: aiops-assistant
          tolerations:
            - key: "role"
              operator: "Equal"
              value: "core-platform"
              effect: "NoSchedule"
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: role
                        operator: In
                        values:
                          - core-platform
          volumes:
            - name: backup-volume
              emptyDir: {}
          initContainers:
            - name: postgres-dump
              image: postgres:15-alpine
              command:
                - /bin/sh
                - -ec
                - |
                  echo "[$(date -u +%FT%TZ)] Starting PostgreSQL backup for 'auth_db' at ${PGHOST}:${PGPORT}..."
                  BACKUP_FILE="/backup/auth_db_dump.sql.gz"
                  
                  pg_dump -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" --clean --if-exists "${PGDATABASE}" | gzip -9 > "${BACKUP_FILE}"
                  
                  FILE_SIZE=$(wc -c < "${BACKUP_FILE}")
                  echo "[$(date -u +%FT%TZ)] pg_dump complete: ${FILE_SIZE} bytes"
                  
                  if [ "${FILE_SIZE}" -lt 500 ]; then
                    echo "[ERROR] Backup size ${FILE_SIZE} bytes is below safety threshold! Aborting." >&2
                    exit 1
                  fi
                  
                  echo "[$(date -u +%FT%TZ)] Verifying gzip integrity..."
                  gzip -t "${BACKUP_FILE}"
                  echo "[$(date -u +%FT%TZ)] gzip integrity confirmed successfully."
              env:
                - name: PGHOST
                  value: boutique-postgres
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: postgres
                - name: PGDATABASE
                  value: auth_db
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: boutique-secrets
                      key: POSTGRES_PASSWORD
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              volumeMounts:
                - name: backup-volume
                  mountPath: /backup
          containers:
            - name: s3-upload
              image: public.ecr.aws/aws-cli/aws-cli:latest
              command:
                - /bin/sh
                - -ec
                - |
                  echo "[$(date -u +%FT%TZ)] Uploading compressed backup to S3 bucket boutique-aiops-backups-592668326948-us-east-2..."
                  TIMESTAMP=$(date -u +%Y%m%d_%H%M%SZ)
                  S3_KEY="backups/auth_db_backup_${TIMESTAMP}.sql.gz"
                  SRC_FILE="/backup/auth_db_dump.sql.gz"
                  
                  if [ ! -f "${SRC_FILE}" ]; then
                    echo "[ERROR] Source backup file not found at ${SRC_FILE}!" >&2
                    exit 1
                  fi
                  
                  aws s3 cp "${SRC_FILE}" "s3://boutique-aiops-backups-592668326948-us-east-2/${S3_KEY}" \
                    --sse aws:kms \
                    --sse-kms-key-id 1e4e2ce3-e642-47a9-a20d-3a47b052918b
                  
                  echo "[$(date -u +%FT%TZ)] S3 upload completed successfully. Verifying uploaded object metadata..."
                  METADATA=$(aws s3api head-object \
                    --bucket boutique-aiops-backups-592668326948-us-east-2 \
                    --key "${S3_KEY}")
                  
                  echo "[$(date -u +%FT%TZ)] Verified S3 Object: ${S3_KEY}"
                  echo "${METADATA}"
                  echo "[$(date -u +%FT%TZ)] Scheduled daily PostgreSQL backup complete and verified."
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              volumeMounts:
                - name: backup-volume
                  mountPath: /backup
