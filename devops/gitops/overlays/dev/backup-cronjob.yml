apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-daily
  namespace: boutique
  labels:
    app: postgres-backup
    component: database
    schedule: daily-0200-ist
spec:
  # Daily at 02:00 AM Asia/Kolkata (20:30 UTC)
  schedule: "30 20 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: OnFailure
          tolerations:
            - key: "role"
              operator: "Equal"
              value: "core-platform"
              effect: "NoSchedule"
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: role
                        operator: In
                        values:
                          - core-platform
          containers:
            - name: postgres-backup
              image: postgres:15-alpine
              command:
                - /bin/sh
                - -ec
                - |
                  echo "[$(date -u +%FT%TZ)] Starting scheduled daily PostgreSQL backup (02:00 AM IST / 20:30 UTC)..."
                  TIMESTAMP=$(date -u +%Y%m%d_%H%M%SZ)
                  BACKUP_FILE="/tmp/auth_db_backup_${TIMESTAMP}.sql.gz"
                  
                  echo "[$(date -u +%FT%TZ)] Running pg_dump for database 'auth_db' at ${PGHOST}:${PGPORT}..."
                  pg_dump -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" --clean --if-exists "${PGDATABASE}" | gzip -9 > "${BACKUP_FILE}"
                  
                  FILE_SIZE=$(wc -c < "${BACKUP_FILE}")
                  echo "[$(date -u +%FT%TZ)] Backup complete: ${BACKUP_FILE} (Size: ${FILE_SIZE} bytes)"
                  
                  if [ "${FILE_SIZE}" -lt 500 ]; then
                    echo "[ERROR] Backup size ${FILE_SIZE} bytes is below safety threshold! Aborting." >&2
                    exit 1
                  fi
                  
                  echo "[$(date -u +%FT%TZ)] Verifying gzip integrity..."
                  gzip -t "${BACKUP_FILE}"
                  echo "[$(date -u +%FT%TZ)] Integrity verified successfully."
                  
                  # Retention summary and metadata
                  echo "[$(date -u +%FT%TZ)] Scheduled backup completed. S3 sync runs via AWS IAM pod identity / cron handler."
                  rm -f "${BACKUP_FILE}"
              env:
                - name: PGHOST
                  value: boutique-postgres
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: postgres
                - name: PGDATABASE
                  value: auth_db
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: boutique-secrets
                      key: POSTGRES_PASSWORD
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
