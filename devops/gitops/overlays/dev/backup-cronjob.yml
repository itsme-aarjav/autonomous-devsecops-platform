apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-daily
  namespace: boutique
  labels:
    app: postgres-backup
    component: database
    schedule: daily-0200-ist
spec:
  # Daily at 02:00 AM Asia/Kolkata (native Kubernetes timezone support)
  schedule: "0 2 * * *"
  timeZone: "Asia/Kolkata"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: postgres-backup
          tolerations:
            - key: "role"
              operator: "Equal"
              value: "core-platform"
              effect: "NoSchedule"
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: role
                        operator: In
                        values:
                          - core-platform
          volumes:
            - name: backup-volume
              emptyDir: {}
          initContainers:
            - name: postgres-dump
              image: postgres:15-alpine
              command:
                - /bin/sh
                - -ec
                - |
                  echo "[$(date -u +%FT%TZ)] Starting PostgreSQL backup for 'auth_db' at ${PGHOST}:${PGPORT}..."
                  TMP_DUMP="/backup/auth_db_dump.sql"
                  BACKUP_FILE="/backup/auth_db_dump.sql.gz"
                  
                  # Fail-closed execution: dump to uncompressed file first so pg_dump failure cannot be masked by gzip
                  pg_dump -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" --clean --if-exists "${PGDATABASE}" > "${TMP_DUMP}"
                  
                  DUMP_SIZE=$(wc -c < "${TMP_DUMP}")
                  echo "[$(date -u +%FT%TZ)] pg_dump complete: ${DUMP_SIZE} bytes"
                  
                  if [ "${DUMP_SIZE}" -lt 500 ]; then
                    echo "[ERROR] Uncompressed dump size ${DUMP_SIZE} bytes is below safety threshold! Aborting." >&2
                    rm -f "${TMP_DUMP}"
                    exit 1
                  fi
                  
                  gzip -9 "${TMP_DUMP}"
                  
                  FILE_SIZE=$(wc -c < "${BACKUP_FILE}")
                  echo "[$(date -u +%FT%TZ)] Gzip compression complete: ${FILE_SIZE} bytes"
                  
                  echo "[$(date -u +%FT%TZ)] Verifying gzip integrity..."
                  gzip -t "${BACKUP_FILE}"
                  echo "[$(date -u +%FT%TZ)] gzip integrity confirmed successfully."
              env:
                - name: PGHOST
                  value: boutique-postgres
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: postgres
                - name: PGDATABASE
                  value: auth_db
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: boutique-secrets
                      key: POSTGRES_PASSWORD
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              volumeMounts:
                - name: backup-volume
                  mountPath: /backup
          containers:
            - name: s3-upload
              image: public.ecr.aws/aws-cli/aws-cli:latest
              command:
                - /bin/sh
                - -ec
                - |
                  echo "[$(date -u +%FT%TZ)] Uploading compressed backup to S3 bucket boutique-aiops-backups-592668326948-us-east-2..."
                  TIMESTAMP=$(date -u +%Y%m%d_%H%M%SZ)
                  S3_KEY="backups/auth_db_backup_${TIMESTAMP}.sql.gz"
                  SRC_FILE="/backup/auth_db_dump.sql.gz"
                  INTENDED_KMS_KEY_ID="1e4e2ce3-e642-47a9-a20d-3a47b052918b"
                  INTENDED_KMS_KEY_ARN="arn:aws:kms:us-east-2:592668326948:key/1e4e2ce3-e642-47a9-a20d-3a47b052918b"
                  
                  if [ ! -f "${SRC_FILE}" ]; then
                    echo "[ERROR] Source backup file not found at ${SRC_FILE}!" >&2
                    exit 1
                  fi
                  
                  aws s3 cp "${SRC_FILE}" "s3://boutique-aiops-backups-592668326948-us-east-2/${S3_KEY}" \
                    --sse aws:kms \
                    --sse-kms-key-id "${INTENDED_KMS_KEY_ID}"
                  
                  echo "[$(date -u +%FT%TZ)] S3 upload completed successfully. Verifying uploaded object metadata..."
                  ACTUAL_SSE=$(aws s3api head-object \
                    --bucket boutique-aiops-backups-592668326948-us-east-2 \
                    --key "${S3_KEY}" \
                    --query "ServerSideEncryption" \
                    --output text 2>/dev/null || echo "")

                  ACTUAL_KMS_KEY=$(aws s3api head-object \
                    --bucket boutique-aiops-backups-592668326948-us-east-2 \
                    --key "${S3_KEY}" \
                    --query "SSEKMSKeyId" \
                    --output text 2>/dev/null || echo "")

                  echo "[$(date -u +%FT%TZ)] Verified S3 Object: ${S3_KEY}"
                  echo "[$(date -u +%FT%TZ)] ServerSideEncryption: ${ACTUAL_SSE}"
                  echo "[$(date -u +%FT%TZ)] SSEKMSKeyId: ${ACTUAL_KMS_KEY}"

                  if [ "${ACTUAL_SSE}" != "aws:kms" ]; then
                    echo "[ERROR] S3 object encryption verification failed! ServerSideEncryption is '${ACTUAL_SSE}', expected 'aws:kms'." >&2
                    exit 1
                  fi

                  if [ "${ACTUAL_KMS_KEY}" != "${INTENDED_KMS_KEY_ARN}" ] && [ "${ACTUAL_KMS_KEY}" != "${INTENDED_KMS_KEY_ID}" ]; then
                    echo "[ERROR] S3 KMS key verification failed! SSEKMSKeyId is '${ACTUAL_KMS_KEY}', expected '${INTENDED_KMS_KEY_ARN}'." >&2
                    exit 1
                  fi

                  echo "[$(date -u +%FT%TZ)] Explicit verification passed: ServerSideEncryption is aws:kms and SSEKMSKeyId matches intended KMS key."
                  echo "[$(date -u +%FT%TZ)] Scheduled daily PostgreSQL backup complete and verified."
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              volumeMounts:
                - name: backup-volume
                  mountPath: /backup
