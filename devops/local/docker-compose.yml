services:
  # PostgreSQL Database (Restored from Stage 6.4.4 backup)
  postgres:
    image: postgres:15-alpine
    container_name: boutique-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - boutique-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Prometheus
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: boutique-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - boutique-network
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:13.3.0
    container_name: boutique-grafana
    ports:
      - "3007:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - boutique-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # API Gateway
  gateway:
    build:
      context: ../../application/backend/services/gateway
      dockerfile: Dockerfile
    container_name: boutique-gateway
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - GATEWAY_PORT=3001
      - "JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be explicitly set in .env}"
      - AUTH_SERVICE_URL=http://auth:3002
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
    networks:
      - boutique-network
    restart: unless-stopped

  # Auth Service
  auth:
    build:
      context: ../../application/backend/services/auth
      dockerfile: Dockerfile
    container_name: boutique-auth
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - "JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be explicitly set in .env}"
      - ENABLE_DEMO_LOGIN=${ENABLE_DEMO_LOGIN:-false}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/auth_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - boutique-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ../../application/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3001/api
    container_name: boutique-frontend
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - boutique-network
    restart: unless-stopped

volumes:
  postgres_data:
    name: boutique-microservices_postgres_restored_data
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  boutique-network:
    driver: bridge
