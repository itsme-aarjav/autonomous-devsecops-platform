apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: in-cluster-git-netpol
  namespace: argocd
spec:
  podSelector:
    matchLabels:
      app: in-cluster-git
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-repo-server
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-application-controller
      ports:
        - protocol: TCP
          port: 9418

