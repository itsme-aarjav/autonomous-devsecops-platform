---
# Automated Self-Healing Runbook: Restart Unhealthy Service
# Location: ansible/playbooks/restart_unhealthy.yml
# Invoked by AIOps Agent upon detecting CrashLoopBackOff or Unhealthy Pods.

- name: Restart Unhealthy Microservice
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    target_workload: "{{ workload | default('auth') }}"
    target_namespace: "{{ namespace | default('boutique') }}"

  tasks:
    - name: Validate target workload parameter
      ansible.builtin.assert:
        that:
          - target_workload in ['auth', 'gateway', 'frontend']
          - target_namespace == 'boutique'
        fail_msg: "Invalid workload '{{ target_workload }}' or namespace '{{ target_namespace }}' provided."

    - name: Display self-healing restart banner
      ansible.builtin.debug:
        msg: "Triggering automated rolling restart for {{ target_workload }} in namespace {{ target_namespace }}..."

    - name: Perform rolling restart for deployment or rollout
      ansible.builtin.command: >
        kubectl rollout restart deployment {{ target_workload }}
        -n {{ target_namespace }}
      register: restart_result
      changed_when: restart_result.rc == 0
      failed_when: false

    - name: Fallback to rollout restart if workload is Argo Rollout
      ansible.builtin.command: >
        kubectl rollout restart rollout {{ target_workload }}
        -n {{ target_namespace }}
      register: argo_restart_result
      changed_when: argo_restart_result.rc == 0
      failed_when: false
      when: restart_result.rc != 0

    - name: Log restart outcome
      ansible.builtin.debug:
        msg: "Rolling restart executed for {{ target_workload }}. Result rc={{ restart_result.rc if restart_result.rc == 0 else argo_restart_result.rc | default(0) }}"
