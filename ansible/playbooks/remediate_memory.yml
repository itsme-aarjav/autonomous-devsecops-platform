---
# Automated Self-Healing Runbook: Memory Limit Remediation
# Location: ansible/playbooks/remediate_memory.yml
# Invoked by AIOps Agent upon detecting Pod OOMKilled incidents.

- name: Remediate Pod OOMKilled condition
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    target_workload: "{{ workload | default('auth') }}"
    target_namespace: "{{ namespace | default('boutique') }}"
    target_memory_limit: "{{ memory_limit | default('512Mi') }}"
    target_memory_request: "{{ memory_request | default('256Mi') }}"

  tasks:
    - name: Validate target workload parameter
      ansible.builtin.assert:
        that:
          - target_workload in ['auth', 'gateway', 'frontend']
          - target_namespace == 'boutique'
        fail_msg: "Invalid workload '{{ target_workload }}' or namespace '{{ target_namespace }}' provided."

    - name: Display self-healing execution banner
      ansible.builtin.debug:
        msg: "Executing automated self-healing for {{ target_workload }} in namespace {{ target_namespace }} (setting memory limit={{ target_memory_limit }}, request={{ target_memory_request }})..."

    - name: Apply runtime memory patch to deployment
      ansible.builtin.command: >
        kubectl set resources deployment {{ target_workload }}
        -n {{ target_namespace }}
        --limits=memory={{ target_memory_limit }}
        --requests=memory={{ target_memory_request }}
      register: patch_result
      changed_when: patch_result.rc == 0
      when: target_workload != 'frontend'

    - name: Apply runtime memory patch to rollout
      ansible.builtin.command: >
        kubectl set resources rollout {{ target_workload }}
        -n {{ target_namespace }}
        --limits=memory={{ target_memory_limit }}
        --requests=memory={{ target_memory_request }}
      register: rollout_patch_result
      changed_when: rollout_patch_result.rc == 0
      when: target_workload == 'frontend'

    - name: Verify rolling restart status
      ansible.builtin.command: >
        kubectl rollout status deployment/{{ target_workload }}
        -n {{ target_namespace }}
        --timeout=60s
      register: rollout_status
      when: target_workload != 'frontend' and patch_result.rc == 0

    - name: Verify argo rollout status
      ansible.builtin.command: >
        kubectl argo rollouts status {{ target_workload }}
        -n {{ target_namespace }}
        --timeout=60s
      register: argo_rollout_status
      when: target_workload == 'frontend' and rollout_patch_result.rc == 0

    - name: Log remediation audit record
      ansible.builtin.debug:
        msg: "Remediation completed for {{ target_workload }}."
