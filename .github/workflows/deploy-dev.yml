name: Deploy DEV (Rollout & Verification)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Target image tag or Git SHA to verify and deploy to DEV"
        required: true
        default: "dev-latest"

permissions:
  contents: read
  id-token: write
  deployments: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-and-verify-dev:
    name: Verify & Record DEV Deployment
    runs-on: ubuntu-24.04
    environment:
      name: development
      url: https://demo.aarjav.site
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create GitHub Deployment Record
        id: create_deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOYMENT_JSON=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/deployments \
            --input - <<EOF
{
  "ref": "${{ github.ref }}",
  "environment": "development",
  "description": "DEV deployment verification for release ${{ github.event.inputs.release_tag }}",
  "transient_environment": false,
  "production_environment": false,
  "auto_merge": false,
  "required_contexts": []
}
EOF
)

          DEPLOYMENT_ID=$(echo "$DEPLOYMENT_JSON" | jq -r .id)
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Created GitHub Deployment ID: $DEPLOYMENT_ID"

          # Set initial status to in_progress
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses \
            -f state="in_progress" \
            -f environment="development" \
            -f environment_url="https://demo.aarjav.site" \
            -f description="Verifying live microservices deployment on EKS..."

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-2
          audience: sts.amazonaws.com

      - name: Verify Immutable Container Image Digests in ECR
        run: |
          SERVICES=("boutique-frontend" "boutique-gateway" "boutique-auth" "boutique-aiops-assistant")
          TAG="${{ github.event.inputs.release_tag }}"
          echo "Verifying ECR image availability for release tag: ${TAG}"

          for svc in "${SERVICES[@]}"; do
            DIGEST=$(aws ecr describe-images \
              --repository-name "${svc}" \
              --image-ids imageTag="${TAG}" \
              --region us-east-2 \
              --query "imageDetails[0].imageDigest" \
              --output text 2>/dev/null || echo "None")

            if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
              echo "Error: Service ${svc} is missing required image tag '${TAG}' in ECR!" >&2
              exit 1
            fi
            echo "  ✓ ${svc}: ${DIGEST}"
          done
          echo "All 4 microservice container digests verified in ECR."

      - name: Verify Kubernetes Cluster Connectivity, Release Parity, and Rollouts (Fail Closed)
        run: |
          echo "Configuring kubectl for EKS cluster boutique-dev-eks..."
          aws eks update-kubeconfig --region us-east-2 --name boutique-dev-eks

          echo "Verifying EKS cluster connectivity (strict fail-closed)..."
          kubectl get nodes -o wide

          echo "Verifying Argo CD GitOps Application Synchronization..."
          SYNC_STATUS=$(kubectl get application boutique -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "Unknown")
          HEALTH_STATUS=$(kubectl get application boutique -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null || echo "Unknown")
          SYNCED_REVISION=$(kubectl get application boutique -n argocd -o jsonpath='{.status.sync.revision}' 2>/dev/null || echo "Unknown")
          echo "Argo CD boutique application status: Sync=${SYNC_STATUS}, Health=${HEALTH_STATUS}, SyncedRevision=${SYNCED_REVISION}"
          if [ "${SYNC_STATUS}" != "Synced" ] || [ "${HEALTH_STATUS}" != "Healthy" ]; then
            echo "Error: Argo CD application 'boutique' is not Synced and Healthy (Sync=${SYNC_STATUS}, Health=${HEALTH_STATUS})!" >&2
            exit 1
          fi

          echo "Verifying desired-versus-running release image parity on live EKS workloads..."
          AUTH_IMG=$(kubectl get deployment/auth -n boutique -o jsonpath='{.spec.template.spec.containers[0].image}')
          GATEWAY_IMG=$(kubectl get deployment/gateway -n boutique -o jsonpath='{.spec.template.spec.containers[0].image}')
          AIOPS_IMG=$(kubectl get deployment/aiops-assistant -n boutique -o jsonpath='{.spec.template.spec.containers[0].image}')
          FRONTEND_IMG=$(kubectl get rollout/frontend -n boutique -o jsonpath='{.spec.template.spec.containers[0].image}')
          CANARY_IMG=$(kubectl get deployment/boutique-canary -n boutique -o jsonpath='{.spec.template.spec.containers[0].image}')

          echo "  ✓ auth deployment image:            ${AUTH_IMG}"
          echo "  ✓ gateway deployment image:         ${GATEWAY_IMG}"
          echo "  ✓ aiops-assistant deployment image: ${AIOPS_IMG}"
          echo "  ✓ frontend rollout image:           ${FRONTEND_IMG}"
          echo "  ✓ boutique-canary deployment image: ${CANARY_IMG}"

          # Verify that each workload is pinned to an immutable digest (@sha256:)
          for img in "${AUTH_IMG}" "${GATEWAY_IMG}" "${AIOPS_IMG}" "${FRONTEND_IMG}"; do
            if [[ "$img" != *"@sha256:"* ]]; then
              echo "Error: Workload image '${img}' violates immutable digest pinning policy (@sha256: required)!" >&2
              exit 1
            fi
          done

          echo "Verifying workload rollouts in namespace 'boutique'..."
          kubectl rollout status deployment/auth -n boutique --timeout=120s
          kubectl rollout status deployment/gateway -n boutique --timeout=120s
          kubectl rollout status deployment/aiops-assistant -n boutique --timeout=120s
          kubectl rollout status deployment/boutique-canary -n boutique --timeout=120s

          echo "Verifying active pods and restart counts..."
          kubectl get pods -n boutique -o wide
          RESTARTS=$(kubectl get pods -n boutique -o jsonpath='{range .items[*]}{range .status.containerStatuses[*]}{.restartCount}{" "}{end}{end}')
          echo "Container restart counts: ${RESTARTS}"
          for count in ${RESTARTS}; do
            if [ "${count}" -gt 5 ]; then
              echo "Error: Detected high restart count (${count}) in boutique workloads!" >&2
              exit 1
            fi
          done

      - name: Execute Live DEV Application Smoke Tests
        id: smoke_tests
        run: |
          echo "Executing live smoke tests against https://demo.aarjav.site..."

          # Smoke Test 1: Frontend HTTPS 200 OK
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://demo.aarjav.site)
          echo "Frontend HTTP Status: ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Error: Frontend returned status ${HTTP_STATUS} (expected 200)" >&2
            exit 1
          fi

          # Smoke Test 2: API Gateway & Auth Health Endpoint
          AUTH_HEALTH=$(curl -s --max-time 15 https://demo.aarjav.site/api/auth/health)
          echo "Auth Health Response: ${AUTH_HEALTH}"
          STATUS_FIELD=$(echo "$AUTH_HEALTH" | jq -r .status 2>/dev/null || echo "invalid")
          if [ "$STATUS_FIELD" != "auth is healthy" ]; then
            echo "Error: Unexpected auth health response: ${AUTH_HEALTH}" >&2
            exit 1
          fi

          # Smoke Test 3: Products Catalog API
          PRODUCTS_JSON=$(curl -s --max-time 15 https://demo.aarjav.site/api/products)
          PROD_COUNT=$(echo "$PRODUCTS_JSON" | jq -r '.data.total // .data.products | length' 2>/dev/null || echo "0")
          echo "Products Catalog Count: ${PROD_COUNT}"
          if [ "$PROD_COUNT" -lt 8 ]; then
            echo "Error: Expected at least 8 seeded products, got: ${PROD_COUNT}" >&2
            exit 1
          fi

          # Smoke Test 4: Product Asset Loading
          IMG_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://demo.aarjav.site/product-images/cashmere-coat.jpg)
          echo "Product Image HTTP Status: ${IMG_STATUS}"
          if [ "$IMG_STATUS" != "200" ]; then
            echo "Error: Expected 200 for product image, got ${IMG_STATUS}" >&2
            exit 1
          fi

          # Smoke Test 5: HTTP to HTTPS 301 Redirect Check
          REDIRECT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 http://demo.aarjav.site)
          echo "HTTP Redirect Status: ${REDIRECT_STATUS}"
          if [ "$REDIRECT_STATUS" != "301" ]; then
            echo "Error: Expected 301 redirect on plain HTTP, got ${REDIRECT_STATUS}" >&2
            exit 1
          fi

          echo "All live application smoke tests PASSED successfully."

      - name: Mark GitHub Deployment Successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOYMENT_ID="${{ steps.create_deployment.outputs.deployment_id }}"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses \
            -f state="success" \
            -f environment="development" \
            -f environment_url="https://demo.aarjav.site" \
            -f description="DEV deployment verified healthy. Live at https://demo.aarjav.site"

      - name: Mark GitHub Deployment Failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOYMENT_ID="${{ steps.create_deployment.outputs.deployment_id }}"
          if [ -n "$DEPLOYMENT_ID" ]; then
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses \
              -f state="failure" \
              -f environment="development" \
              -f environment_url="https://demo.aarjav.site" \
              -f description="DEV deployment verification failed smoke tests."
          fi
