name: Deploy DEV (Rollout & Verification)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Target image tag or Git SHA to verify and deploy to DEV"
        required: true
        default: "dev-latest"
      action:
        description: "Execution action: 'verify' (validate current DEV deployment) or 'deploy' (prepare reviewed GitOps PR for promotion)"
        required: true
        default: "verify"
        type: choice
        options:
          - verify
          - deploy

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  prepare-promotion:
    name: Prepare DEV GitOps Promotion PR
    if: github.event.inputs.action == 'deploy'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      deployments: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Create GitHub Deployment Record
        id: create_deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          DESC="DEV promotion PR preparation for release ${TAG}"

          DEPLOYMENT_PAYLOAD=$(jq -n \
            --arg ref "${{ github.ref }}" \
            --arg desc "$DESC" \
            '{ref: $ref, environment: "development", description: $desc, transient_environment: false, production_environment: false, auto_merge: false, required_contexts: []}')

          DEPLOYMENT_JSON=$(echo "$DEPLOYMENT_PAYLOAD" | gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/deployments \
            --input -)

          DEPLOYMENT_ID=$(echo "$DEPLOYMENT_JSON" | jq -r .id)
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Created GitHub Deployment ID: $DEPLOYMENT_ID"

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses \
            -f state="in_progress" \
            -f environment="development" \
            -f environment_url="https://demo.aarjav.site" \
            -f description="Resolving digests and preparing promotion PR for release ${TAG}..."

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-2
          audience: sts.amazonaws.com

      - name: Resolve Immutable Container Image Digests in ECR
        id: resolve_ecr
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          ACCOUNT_ID="592668326948"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.us-east-2.amazonaws.com"
          echo "Resolving ECR digests for target release tag: ${TAG}"

          declare -A SERVICE_REPOS=(
            ["boutique-frontend"]="boutique-frontend"
            ["boutique-gateway"]="boutique-gateway"
            ["boutique-auth"]="boutique-auth"
            ["boutique-aiops-assistant"]="boutique-aiops-assistant"
          )

          mkdir -p /tmp/release_digests
          for svc in "${!SERVICE_REPOS[@]}"; do
            repo="${SERVICE_REPOS[$svc]}"
            DIGEST=$(aws ecr describe-images \
              --repository-name "${repo}" \
              --image-ids imageTag="${TAG}" \
              --region us-east-2 \
              --query "imageDetails[0].imageDigest" \
              --output text 2>/dev/null || echo "None")

            if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
              echo "Error: Repository ${repo} is missing required image tag '${TAG}' in ECR!" >&2
              exit 1
            fi
            var_name="${svc//-/_}"
            echo "${var_name}=${DIGEST}" >> /tmp/release_digests/digests.env
            echo "  ✓ ${svc}: ${DIGEST}"
          done
          echo "All 4 microservice container digests resolved in ECR."

      - name: Prepare Reviewed GitOps Promotion PR (No Auto-Merge)
        id: prepare_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source /tmp/release_digests/digests.env
          TAG="${{ github.event.inputs.release_tag }}"
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "Error: Invalid release_tag format '${TAG}'!" >&2
            exit 1
          fi

          ACCOUNT_ID="592668326948"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.us-east-2.amazonaws.com"
          BRANCH_NAME="gitops/promote-dev-${TAG}"
          DEPLOYMENT_ID="${{ steps.create_deployment.outputs.deployment_id }}"

          echo "Updating GitOps overlay manifests for release '${TAG}'..."
          python3 devops/scripts/update_gitops_image.py \
            --manifest devops/gitops/overlays/dev/frontend.yml \
            --service boutique-frontend \
            --image-uri "${REGISTRY}/boutique-frontend@${boutique_frontend}"

          python3 devops/scripts/update_gitops_image.py \
            --manifest devops/gitops/overlays/dev/gateway.yml \
            --service boutique-gateway \
            --image-uri "${REGISTRY}/boutique-gateway@${boutique_gateway}"

          python3 devops/scripts/update_gitops_image.py \
            --manifest devops/gitops/overlays/dev/auth.yml \
            --service boutique-auth \
            --image-uri "${REGISTRY}/boutique-auth@${boutique_auth}"

          python3 devops/scripts/update_gitops_image.py \
            --manifest devops/gitops/overlays/dev/aiops.yml \
            --service boutique-aiops-assistant \
            --image-uri "${REGISTRY}/boutique-aiops-assistant@${boutique_aiops_assistant}"

          echo "Validating updated GitOps overlay with Kustomize..."
          kubectl kustomize devops/gitops/overlays/dev/ > /dev/null

          if git status --porcelain | grep -q "devops/gitops/overlays/dev"; then
            echo "Changes detected against main. Checking for existing open promotion PR..."
            EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --state open --json url -q '.[0].url' || echo "")

            if [ -n "$EXISTING_PR" ]; then
              echo "Existing open promotion PR already exists: $EXISTING_PR"
              PR_URL="$EXISTING_PR"
            else
              echo "Creating promotion branch and PR..."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"

              git checkout -B "$BRANCH_NAME"
              git add devops/gitops/overlays/dev/
              git commit -m "chore(gitops): promote release ${TAG} to DEV [skip ci]"
              git push origin "$BRANCH_NAME" --force

              PR_BODY="Automated GitOps DEV promotion PR for release \`${TAG}\`. Promoted digests: frontend (\`${boutique_frontend}\`), gateway (\`${boutique_gateway}\`), auth (\`${boutique_auth}\`), aiops (\`${boutique_aiops_assistant}\`). ACTION REQUIRED: Human review & merge required. Merging will trigger Argo CD deployment to EKS."

              PR_URL=$(gh pr create \
                --base main \
                --head "$BRANCH_NAME" \
                --title "chore(gitops): promote release ${TAG} to DEV" \
                --body "$PR_BODY")
              echo "Created promotion PR: $PR_URL"
            fi

            echo "================================================================================"
            echo "PROMOTION PR READY: $PR_URL"
            echo "STATUS: AWAITING_HUMAN_REVIEW"
            echo "Human review required. Workflow will NOT auto-merge or commit to main directly."
            echo "================================================================================"

            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses \
              -f state="in_progress" \
              -f environment="development" \
              -f environment_url="https://demo.aarjav.site" \
              -f description="AWAITING_HUMAN_REVIEW: Promotion PR created ($PR_URL). Awaiting engineer review & merge."
          else
            echo "GitOps overlay manifests on main are already pinned to target release digests."
            echo "================================================================================"
            echo "STATUS: ALREADY_PINNED"
            echo "Manifests on main already match release ${TAG}. Run with action=verify to test."
            echo "================================================================================"

            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses \
              -f state="in_progress" \
              -f environment="development" \
              -f environment_url="https://demo.aarjav.site" \
              -f description="ALREADY_PINNED: GitOps manifests in main already match release ${TAG}. Run action=verify to validate cluster parity."
          fi

      - name: Mark Deployment Preparation Failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOYMENT_ID="${{ steps.create_deployment.outputs.deployment_id }}"
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -n "$DEPLOYMENT_ID" ]; then
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses \
              -f state="failure" \
              -f environment="development" \
              -f environment_url="https://demo.aarjav.site" \
              -f description="DEV GitOps promotion preparation FAILED for ${TAG}."
          fi

  verify-deployment:
    name: Verify DEV Deployment & Smoke Tests
    if: github.event.inputs.action == 'verify'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-2
          audience: sts.amazonaws.com

      - name: Resolve Immutable Container Image Digests in ECR
        id: resolve_ecr
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          ACCOUNT_ID="592668326948"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.us-east-2.amazonaws.com"
          echo "Resolving ECR digests for target release tag: ${TAG}"

          declare -A SERVICE_REPOS=(
            ["boutique-frontend"]="boutique-frontend"
            ["boutique-gateway"]="boutique-gateway"
            ["boutique-auth"]="boutique-auth"
            ["boutique-aiops-assistant"]="boutique-aiops-assistant"
          )

          mkdir -p /tmp/release_digests
          for svc in "${!SERVICE_REPOS[@]}"; do
            repo="${SERVICE_REPOS[$svc]}"
            DIGEST=$(aws ecr describe-images \
              --repository-name "${repo}" \
              --image-ids imageTag="${TAG}" \
              --region us-east-2 \
              --query "imageDetails[0].imageDigest" \
              --output text 2>/dev/null || echo "None")

            if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
              echo "Error: Repository ${repo} is missing required image tag '${TAG}' in ECR!" >&2
              exit 1
            fi
            var_name="${svc//-/_}"
            echo "${var_name}=${DIGEST}" >> /tmp/release_digests/digests.env
            echo "  ✓ ${svc}: ${DIGEST}"
          done
          echo "All 4 microservice container digests resolved in ECR."

      - name: Verify Release-to-GitOps-to-EKS Digest Parity and Argo CD Revision (Strict Fail-Closed)
        run: |
          source /tmp/release_digests/digests.env
          TAG="${{ github.event.inputs.release_tag }}"

          echo "Configuring kubectl for EKS cluster boutique-dev-eks..."
          aws eks update-kubeconfig --region us-east-2 --name boutique-dev-eks

          echo "Verifying EKS cluster connectivity (strict fail-closed)..."
          kubectl get nodes -o wide

          echo "================================================================================"
          echo "VERIFYING RELEASE-TO-GITOPS-TO-EKS PARITY (Fail-Closed Gate)"
          echo "================================================================================"

          # 1. Verify GitOps Overlay Manifest Parity
          echo "[1/3] Verifying GitOps Overlay Manifest Parity against requested release '${TAG}'..."
          check_gitops_parity() {
            local svc="$1"
            local manifest="$2"
            local expected_digest="$3"
            local pinned_digest
            pinned_digest=$(grep -oE "sha256:[a-f0-9]{64}" "$manifest" | head -1 || echo "missing")

            echo "  Checking GitOps overlay: ${svc} (${manifest})"
            echo "    Target ECR Digest   : ${expected_digest}"
            echo "    Pinned GitOps Digest: ${pinned_digest}"

            if [ "$pinned_digest" != "$expected_digest" ]; then
              echo "Error: Release parity mismatch for ${svc}! Overlay manifest '${manifest}' has '${pinned_digest}', but target release '${TAG}' is '${expected_digest}'." >&2
              echo "Never report success for an undeployed requested release." >&2
              exit 1
            fi
            echo "    ✓ GitOps manifest matches target release digest."
          }

          check_gitops_parity "boutique-frontend" "devops/gitops/overlays/dev/frontend.yml" "$boutique_frontend"
          check_gitops_parity "boutique-gateway" "devops/gitops/overlays/dev/gateway.yml" "$boutique_gateway"
          check_gitops_parity "boutique-auth" "devops/gitops/overlays/dev/auth.yml" "$boutique_auth"
          check_gitops_parity "boutique-aiops-assistant" "devops/gitops/overlays/dev/aiops.yml" "$boutique_aiops_assistant"

          # 2. Verify Argo CD Application Status & Exact Synced Revision
          echo "[2/5] Verifying Argo CD GitOps Application Synchronization & Exact Git Revision..."
          MAX_WAIT=120
          ELAPSED=0
          EXPECTED_REVISION="${{ github.sha }}"

          # Trigger Argo CD refresh to ensure it evaluates the current commit
          kubectl annotate application boutique -n argocd argocd.argoproj.io/refresh=normal --overwrite 2>/dev/null || true

          while true; do
            SYNC_STATUS=$(kubectl get application boutique -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "Unknown")
            HEALTH_STATUS=$(kubectl get application boutique -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null || echo "Unknown")
            SYNCED_REVISION=$(kubectl get application boutique -n argocd -o jsonpath='{.status.sync.revision}' 2>/dev/null || echo "Unknown")
            echo "  Argo CD status (elapsed ${ELAPSED}s): Sync=${SYNC_STATUS}, Health=${HEALTH_STATUS}, Revision=${SYNCED_REVISION} (Expected=${EXPECTED_REVISION})"

            if [ "${SYNC_STATUS}" = "Synced" ] && [ "${HEALTH_STATUS}" = "Healthy" ] && [ "${SYNCED_REVISION}" = "${EXPECTED_REVISION}" ]; then
              echo "  ✓ Argo CD boutique application is Synced and Healthy at exact expected revision ${SYNCED_REVISION}."
              break
            fi

            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "Error: Argo CD failed to achieve Synced & Healthy state at expected revision ${EXPECTED_REVISION} within ${MAX_WAIT}s (Sync=${SYNC_STATUS}, Health=${HEALTH_STATUS}, SyncedRevision=${SYNCED_REVISION})!" >&2
              exit 1
            fi
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

          # 3. Verify Deployment & Rollout Replica Parity (Desired = Current = Updated = Ready = Available)
          echo "[3/5] Verifying Deployment & Rollout Replica Parity from Specifications..."
          check_deployment_replicas() {
            local name="$1"
            echo "  Checking Deployment: ${name} (namespace: boutique)"

            local desired current updated ready available
            desired=$(kubectl get deployment "$name" -n boutique -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "0")
            current=$(kubectl get deployment "$name" -n boutique -o jsonpath='{.status.replicas}' 2>/dev/null || echo "0")
            updated=$(kubectl get deployment "$name" -n boutique -o jsonpath='{.status.updatedReplicas}' 2>/dev/null || echo "0")
            ready=$(kubectl get deployment "$name" -n boutique -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
            available=$(kubectl get deployment "$name" -n boutique -o jsonpath='{.status.availableReplicas}' 2>/dev/null || echo "0")

            echo "    Replicas -> Desired: ${desired}, Current: ${current}, Updated: ${updated}, Ready: ${ready}, Available: ${available}"

            if [ -z "$desired" ] || [ "$desired" -lt 1 ]; then
              echo "Error: Invalid or zero desired replicas for deployment/${name}!" >&2
              exit 1
            fi

            if [ "$current" != "$desired" ] || [ "$updated" != "$desired" ] || [ "$ready" != "$desired" ] || [ "$available" != "$desired" ]; then
              echo "Error: Replica count mismatch for deployment/${name}! Desired: ${desired}, Current: ${current}, Updated: ${updated}, Ready: ${ready}, Available: ${available}" >&2
              echo "Stale, unready, or missing replicas detected. Failing closed." >&2
              exit 1
            fi
            echo "    ✓ Deployment ${name} has all ${desired} replica(s) current, updated, ready, and available."
          }

          check_deployment_replicas "auth"
          check_deployment_replicas "gateway"
          check_deployment_replicas "aiops-assistant"
          check_deployment_replicas "boutique-canary"

          # 4. Verify Frontend Argo Rollout Completion & Replica Parity
          echo "[4/5] Verifying Frontend Argo Rollout Full Completion & Health..."
          check_frontend_rollout() {
            echo "  Checking Rollout: frontend (namespace: boutique)"

            local ro_desired ro_current ro_updated ro_ready ro_available ro_phase ro_completed ro_paused ro_step
            ro_desired=$(kubectl get rollout frontend -n boutique -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "0")
            ro_current=$(kubectl get rollout frontend -n boutique -o jsonpath='{.status.replicas}' 2>/dev/null || echo "0")
            ro_updated=$(kubectl get rollout frontend -n boutique -o jsonpath='{.status.updatedReplicas}' 2>/dev/null || echo "0")
            ro_ready=$(kubectl get rollout frontend -n boutique -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
            ro_available=$(kubectl get rollout frontend -n boutique -o jsonpath='{.status.availableReplicas}' 2>/dev/null || echo "0")
            ro_phase=$(kubectl get rollout frontend -n boutique -o jsonpath='{.status.phase}' 2>/dev/null || echo "Unknown")
            ro_completed=$(kubectl get rollout frontend -n boutique -o jsonpath='{.status.conditions[?(@.type=="Completed")].status}' 2>/dev/null || echo "False")
            ro_paused=$(kubectl get rollout frontend -n boutique -o jsonpath='{.status.conditions[?(@.type=="Paused")].status}' 2>/dev/null || echo "False")
            ro_step=$(kubectl get rollout frontend -n boutique -o jsonpath='{.status.currentStepIndex}' 2>/dev/null || echo "0")

            echo "    Rollout Replicas -> Desired: ${ro_desired}, Current: ${ro_current}, Updated: ${ro_updated}, Ready: ${ro_ready}, Available: ${ro_available}"
            echo "    Rollout Health   -> Phase: ${ro_phase}, Completed: ${ro_completed}, Paused: ${ro_paused}, StepIndex: ${ro_step}"

            if [ -z "$ro_desired" ] || [ "$ro_desired" -lt 1 ]; then
              echo "Error: Invalid or zero desired replicas for rollout/frontend!" >&2
              exit 1
            fi

            if [ "$ro_current" != "$ro_desired" ] || [ "$ro_updated" != "$ro_desired" ] || [ "$ro_ready" != "$ro_desired" ] || [ "$ro_available" != "$ro_desired" ]; then
              echo "Error: Replica count mismatch for rollout/frontend! Desired: ${ro_desired}, Current: ${ro_current}, Updated: ${ro_updated}, Ready: ${ro_ready}, Available: ${ro_available}" >&2
              exit 1
            fi

            if [ "$ro_phase" != "Healthy" ]; then
              echo "Error: Rollout frontend is not Healthy (phase: ${ro_phase})!" >&2
              exit 1
            fi

            if [ "$ro_completed" != "True" ]; then
              echo "Error: Rollout frontend has not completed rollout (Completed condition: ${ro_completed})!" >&2
              exit 1
            fi

            if [ "$ro_paused" = "True" ]; then
              echo "Error: Rollout frontend is paused during rollout!" >&2
              exit 1
            fi
            echo "    ✓ Frontend Argo Rollout is Healthy, fully Completed (not paused), and all ${ro_desired} replicas match desired count."
          }
          check_frontend_rollout

          # 5. Verify Live EKS Running Pod Image Parity across EVERY Replica (Strict Counts & Digests)
          echo "[5/5] Verifying desired-versus-running release image parity on live EKS workloads (EVERY replica)..."
          check_pod_parity() {
            local svc="$1"
            local label_selector="$2"
            local expected_digest="$3"
            local expected_replicas="$4"

            echo "  Checking All Live Pod Replicas: ${svc} (selector: ${label_selector}, expected: ${expected_replicas})"
            echo "    Target ECR Digest: ${expected_digest}"

            local pod_data
            pod_data=$(kubectl get pods -n boutique -l "$label_selector" -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{range .status.containerStatuses[*]}{.imageID}{"\t"}{.ready}{"\n"}{end}{end}' 2>/dev/null || echo "")

            if [ -z "$pod_data" ]; then
              echo "Error: No pods found for ${svc} matching selector '${label_selector}'!" >&2
              exit 1
            fi

            local replica_count=0
            while IFS=$'\t' read -r pod_name pod_image_id is_ready; do
              [ -z "$pod_name" ] && continue
              replica_count=$((replica_count + 1))
              local pod_digest
              pod_digest=$(echo "$pod_image_id" | grep -oE "sha256:[a-f0-9]{64}" || echo "invalid")

              echo "    Replica #${replica_count} [${pod_name}]:"
              echo "      imageID : ${pod_image_id}"
              echo "      Digest  : ${pod_digest}"
              echo "      Ready   : ${is_ready}"

              if [ "$pod_digest" != "$expected_digest" ]; then
                echo "Error: Workload parity mismatch for ${svc} replica '${pod_name}'! Running digest is '${pod_digest}', but target release '${TAG}' is '${expected_digest}'." >&2
                echo "EVERY replica must run the target release digest. Failing closed." >&2
                exit 1
              fi

              if [ "$is_ready" != "true" ]; then
                echo "Error: Workload replica '${pod_name}' is not Ready!" >&2
                exit 1
              fi
            done <<< "$pod_data"

            if [ "$replica_count" -ne "$expected_replicas" ]; then
              echo "Error: Replica count mismatch for ${svc}! Expected exactly ${expected_replicas} running pod(s), but found ${replica_count}." >&2
              echo "Stale or missing pods detected. Failing closed." >&2
              exit 1
            fi
            echo "    ✓ Verified all ${replica_count} replica(s) match target release digest and are Ready."
          }

          ro_desired=$(kubectl get rollout frontend -n boutique -o jsonpath='{.spec.replicas}')
          auth_desired=$(kubectl get deployment auth -n boutique -o jsonpath='{.spec.replicas}')
          gw_desired=$(kubectl get deployment gateway -n boutique -o jsonpath='{.spec.replicas}')
          aiops_desired=$(kubectl get deployment aiops-assistant -n boutique -o jsonpath='{.spec.replicas}')

          check_pod_parity "boutique-frontend" "app=frontend" "$boutique_frontend" "$ro_desired"
          check_pod_parity "boutique-gateway" "app=gateway" "$boutique_gateway" "$gw_desired"
          check_pod_parity "boutique-auth" "app=auth" "$boutique_auth" "$auth_desired"
          check_pod_parity "boutique-aiops-assistant" "app.kubernetes.io/name=aiops-assistant" "$boutique_aiops_assistant" "$aiops_desired"

          echo "Verifying workload rollouts in namespace 'boutique'..."
          kubectl rollout status deployment/auth -n boutique --timeout=120s
          kubectl rollout status deployment/gateway -n boutique --timeout=120s
          kubectl rollout status deployment/aiops-assistant -n boutique --timeout=120s
          kubectl rollout status deployment/boutique-canary -n boutique --timeout=120s

          echo "Verifying active pods and restart counts..."
          kubectl get pods -n boutique -o wide
          RESTARTS=$(kubectl get pods -n boutique -o jsonpath='{range .items[*]}{range .status.containerStatuses[*]}{.restartCount}{" "}{end}{end}')
          echo "Container restart counts: ${RESTARTS}"
          for count in ${RESTARTS}; do
            if [ "${count}" -gt 5 ]; then
              echo "Error: Detected high restart count (${count}) in boutique workloads!" >&2
              exit 1
            fi
          done
          echo "All release-to-GitOps-to-EKS parity gates PASSED successfully."

      - name: Execute Live DEV Application Smoke Tests
        id: smoke_tests
        run: |
          echo "Executing live smoke tests against https://demo.aarjav.site..."

          # Smoke Test 1: Frontend HTTPS 200 OK
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://demo.aarjav.site)
          echo "Frontend HTTP Status: ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Error: Frontend returned status ${HTTP_STATUS} (expected 200)" >&2
            exit 1
          fi

          # Smoke Test 2: API Gateway & Auth Health Endpoint
          AUTH_HEALTH=$(curl -s --max-time 15 https://demo.aarjav.site/api/auth/health)
          echo "Auth Health Response: ${AUTH_HEALTH}"
          STATUS_FIELD=$(echo "$AUTH_HEALTH" | jq -r .status 2>/dev/null || echo "invalid")
          if [ "$STATUS_FIELD" != "auth is healthy" ]; then
            echo "Error: Unexpected auth health response: ${AUTH_HEALTH}" >&2
            exit 1
          fi

          # Smoke Test 3: Products Catalog API
          PRODUCTS_JSON=$(curl -s --max-time 15 https://demo.aarjav.site/api/products)
          PROD_COUNT=$(echo "$PRODUCTS_JSON" | jq -r '.data.total // .data.products | length' 2>/dev/null || echo "0")
          echo "Products Catalog Count: ${PROD_COUNT}"
          if [ "$PROD_COUNT" -lt 8 ]; then
            echo "Error: Expected at least 8 seeded products, got: ${PROD_COUNT}" >&2
            exit 1
          fi

          # Smoke Test 4: Product Asset Loading
          IMG_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://demo.aarjav.site/product-images/cashmere-coat.jpg)
          echo "Product Image HTTP Status: ${IMG_STATUS}"
          if [ "$IMG_STATUS" != "200" ]; then
            echo "Error: Expected 200 for product image, got ${IMG_STATUS}" >&2
            exit 1
          fi

          # Smoke Test 5: HTTP to HTTPS 301 Redirect Check
          REDIRECT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 http://demo.aarjav.site)
          echo "HTTP Redirect Status: ${REDIRECT_STATUS}"
          if [ "$REDIRECT_STATUS" != "301" ]; then
            echo "Error: Expected 301 redirect on plain HTTP, got ${REDIRECT_STATUS}" >&2
            exit 1
          fi

          echo "All live application smoke tests PASSED successfully."
