name: Deploy DEV

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Microservice to publish and deploy (or 'all')"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - boutique-auth
          - boutique-gateway
          - boutique-frontend
          - boutique-aiops-assistant
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  deployments: write

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-and-deploy-dev:
    name: Build, Scan & Publish to ECR (DEV)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: boutique-auth
            build_dir: application/backend/services/auth
          - service: boutique-gateway
            build_dir: application/backend/services/gateway
          - service: boutique-frontend
            build_dir: application/frontend
          - service: boutique-aiops-assistant
            build_dir: aiops
            dockerfile: aiops/Dockerfile.agent
    steps:
      - name: Filter Target Service
        id: filter
        run: |
          TARGET="${{ github.event.inputs.service || 'all' }}"
          if [ "$TARGET" != "all" ] && [ "$TARGET" != "${{ matrix.service }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.service }} (target is $TARGET)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Code
        if: steps.filter.outputs.skip == 'false'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Container Image
        if: steps.filter.outputs.skip == 'false'
        run: |
          if [ -n "${{ matrix.dockerfile }}" ]; then
            docker build -f "${{ matrix.dockerfile }}" -t "${{ matrix.service }}:${{ github.sha }}" "${{ matrix.build_dir }}"
          else
            docker build -t "${{ matrix.service }}:${{ github.sha }}" "${{ matrix.build_dir }}"
          fi

      - name: Verify Non-Root User Execution for Frontend
        if: steps.filter.outputs.skip == 'false' && matrix.service == 'boutique-frontend'
        run: |
          CONTAINER_UID=$(docker run --rm "${{ matrix.service }}:${{ github.sha }}" id -u)
          if [ "${CONTAINER_UID}" != "10001" ]; then
            echo "Error: Frontend container must run as dedicated non-root UID 10001 (found ${CONTAINER_UID})"
            exit 1
          fi

      - name: Scan Microservice Container with Trivy
        if: steps.filter.outputs.skip == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: '${{ matrix.service }}:${{ github.sha }}'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Debug GitHub OIDC Claims
        if: steps.filter.outputs.skip == 'false'
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            RESP=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
            JWT=$(echo "$RESP" | jq -r '.value // empty')
            if [ -n "$JWT" ]; then
              PAYLOAD=$(echo "$JWT" | cut -d'.' -f2)
              # Pad base64 string
              PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
              for i in $(seq 1 $PAD); do PAYLOAD="${PAYLOAD}="; done
              echo "Decoded OIDC Token Claims:"
              echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{sub: .sub, aud: .aud, repository: .repository, ref: .ref, actor: .actor, iss: .iss}'
            else
              echo "Could not retrieve OIDC JWT from actions runtime."
            fi
          else
            echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN not present."
          fi

      - name: Configure AWS Credentials via GitHub OIDC
        if: steps.filter.outputs.skip == 'false'
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-2
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        if: steps.filter.outputs.skip == 'false'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Publish Verified Image to ECR & Resolve Digest
        if: steps.filter.outputs.skip == 'false'
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          TAGGED_IMAGE="${REGISTRY}/${{ matrix.service }}:${{ github.sha }}"
          TAGGED_DEV="${REGISTRY}/${{ matrix.service }}:dev-latest"
          docker tag "${{ matrix.service }}:${{ github.sha }}" "${TAGGED_IMAGE}"
          docker tag "${{ matrix.service }}:${{ github.sha }}" "${TAGGED_DEV}"
          echo "Pushing immutable image: ${TAGGED_IMAGE}..."
          docker push "${TAGGED_IMAGE}"
          docker push "${TAGGED_DEV}"

          DIGEST=$(aws ecr describe-images \
            --repository-name "${{ matrix.service }}" \
            --image-ids imageTag="${{ github.sha }}" \
            --region us-east-2 \
            --query "imageDetails[0].imageDigest" \
            --output text)

          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "Error: Failed to resolve ECR image digest for ${{ matrix.service }}" >&2
            exit 1
          fi

          echo "Successfully published ${{ matrix.service }} to ECR with digest: ${DIGEST}"
