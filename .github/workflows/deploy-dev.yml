name: Deploy DEV (Rollout & Verification)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Target image tag or Git SHA to verify and deploy to DEV"
        required: true
        default: "dev-latest"

permissions:
  contents: read
  id-token: write
  deployments: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-and-verify-dev:
    name: Verify & Record DEV Deployment
    runs-on: ubuntu-24.04
    environment:
      name: development
      url: https://demo.aarjav.site
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create GitHub Deployment Record
        id: create_deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOYMENT_JSON=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/deployments \
            -f ref="${{ github.ref }}" \
            -f environment="development" \
            -f description="DEV deployment verification for release ${{ github.event.inputs.release_tag }}" \
            -F transient_environment=false \
            -F production_environment=false \
            -F auto_merge=false \
            -F required_contexts='[]')

          DEPLOYMENT_ID=$(echo "$DEPLOYMENT_JSON" | jq -r .id)
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Created GitHub Deployment ID: $DEPLOYMENT_ID"

          # Set initial status to in_progress
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses \
            -f state="in_progress" \
            -f environment="development" \
            -f environment_url="https://demo.aarjav.site" \
            -f description="Verifying live microservices deployment on EKS..."

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-2
          audience: sts.amazonaws.com

      - name: Verify Immutable Container Image Digests in ECR
        run: |
          SERVICES=("boutique-frontend" "boutique-gateway" "boutique-auth" "boutique-aiops-assistant")
          TAG="${{ github.event.inputs.release_tag }}"
          echo "Verifying ECR image availability for release tag: ${TAG}"

          for svc in "${SERVICES[@]}"; do
            DIGEST=$(aws ecr describe-images \
              --repository-name "${svc}" \
              --image-ids imageTag="${TAG}" \
              --region us-east-2 \
              --query "imageDetails[0].imageDigest" \
              --output text 2>/dev/null || echo "None")

            if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
              echo "Error: Service ${svc} is missing required image tag '${TAG}' in ECR!" >&2
              exit 1
            fi
            echo "  ✓ ${svc}: ${DIGEST}"
          done
          echo "All 4 microservice container digests verified in ECR."

      - name: Execute Live DEV Application Smoke Tests
        id: smoke_tests
        run: |
          echo "Executing live smoke tests against https://demo.aarjav.site..."

          # Smoke Test 1: Frontend HTTPS 200 OK
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://demo.aarjav.site)
          echo "Frontend HTTP Status: ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Error: Frontend returned status ${HTTP_STATUS} (expected 200)" >&2
            exit 1
          fi

          # Smoke Test 2: API Gateway & Auth Health Endpoint
          AUTH_HEALTH=$(curl -s --max-time 15 https://demo.aarjav.site/api/auth/health)
          echo "Auth Health Response: ${AUTH_HEALTH}"
          STATUS_FIELD=$(echo "$AUTH_HEALTH" | jq -r .status 2>/dev/null || echo "invalid")
          if [ "$STATUS_FIELD" != "auth is healthy" ]; then
            echo "Error: Unexpected auth health response: ${AUTH_HEALTH}" >&2
            exit 1
          fi

          # Smoke Test 3: HTTP to HTTPS 301 Redirect Check
          REDIRECT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 http://demo.aarjav.site)
          echo "HTTP Redirect Status: ${REDIRECT_STATUS}"
          if [ "$REDIRECT_STATUS" != "301" ]; then
            echo "Error: Expected 301 redirect on plain HTTP, got ${REDIRECT_STATUS}" >&2
            exit 1
          fi

          echo "All live application smoke tests PASSED successfully."

      - name: Mark GitHub Deployment Successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOYMENT_ID="${{ steps.create_deployment.outputs.deployment_id }}"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses \
            -f state="success" \
            -f environment="development" \
            -f environment_url="https://demo.aarjav.site" \
            -f description="DEV deployment verified healthy. Live at https://demo.aarjav.site"

      - name: Mark GitHub Deployment Failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOYMENT_ID="${{ steps.create_deployment.outputs.deployment_id }}"
          if [ -n "$DEPLOYMENT_ID" ]; then
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses \
              -f state="failure" \
              -f environment="development" \
              -f environment_url="https://demo.aarjav.site" \
              -f description="DEV deployment verification failed smoke tests."
          fi
