name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate-terraform:
    name: Terraform Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.0

      - name: Validate Terraform Formatting
        run: terraform fmt -recursive -check devops/terraform

  validate-ansible:
    name: Ansible Syntax Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install Ansible Core
        run: pip install --no-cache-dir ansible-core==2.17.5

      - name: Syntax Check Playbooks
        run: ansible-playbook -i devops/ansible/inventory.ini devops/ansible/playbooks/*.yml --syntax-check

  validate-kustomize:
    name: Kustomize Manifest Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and Validate GitOps Manifests
        run: |
          kubectl kustomize devops/gitops/ > /dev/null
          kubectl kustomize devops/gitops/overlays/dev/ > /dev/null

  validate-shell:
    name: Shell Script Syntax Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Shell Script Syntax
        run: |
          find . -name "*.sh" -not -path "*/node_modules/*" -exec bash -n {} +

  validate-aiops:
    name: AIOps Unit & Security Regression Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install --no-cache-dir pydantic==2.10.3 pyyaml==6.0.2 requests==2.32.3 boto3==1.35.71

      - name: Run AIOps Unit & Security Tests
        run: python3 -m unittest discover -s aiops/tests -p "test_*.py" -v

  scan-trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy Vulnerability Scanner (FS)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  validate-boutique-containers:
    name: Validate Boutique Containers (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: boutique-auth
            build_dir: application/backend/services/auth
          - service: boutique-gateway
            build_dir: application/backend/services/gateway
          - service: boutique-frontend
            build_dir: application/frontend
          - service: boutique-aiops-assistant
            build_dir: aiops
            dockerfile: aiops/Dockerfile.agent
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Container Image
        run: |
          if [ -n "${{ matrix.dockerfile }}" ]; then
            docker build -f "${{ matrix.dockerfile }}" -t "${{ matrix.service }}:${{ github.sha }}" "${{ matrix.build_dir }}"
          else
            docker build -t "${{ matrix.service }}:${{ github.sha }}" "${{ matrix.build_dir }}"
          fi

      - name: Verify Non-Root User Execution for Frontend Container
        if: matrix.service == 'boutique-frontend'
        run: |
          CONTAINER_UID=$(docker run --rm "${{ matrix.service }}:${{ github.sha }}" id -u)
          echo "Boutique Frontend Container UID: ${CONTAINER_UID}"
          if [ "${CONTAINER_UID}" != "10001" ]; then
            echo "Error: Frontend container must run as dedicated non-root UID 10001 (found ${CONTAINER_UID})"
            exit 1
          fi

      - name: Scan Microservice Container with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: '${{ matrix.service }}:${{ github.sha }}'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
